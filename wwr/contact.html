<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Kings And Priests Rafting Company. Address, phone, email, map, and form.">
    <title>Contact Us- Kings And Priests Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="Images/logo.png" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <div class="contact-info">
            <div>
                <p><strong>Address:</strong>12 Okpu River Road, Aba, Nigeria</p>
                <p><strong>Phone:</strong>+234 803 123 4567</p>
                <p><strong>Email:</strong>kingsandpriest123@rafting.com</p>
            </div>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d127155.28810059399!2d7.3892416!3d5.1674269!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1790945297641!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>

        </div>

        <section class="employees">
            <h2>Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="Images/employee1.jpg" alt="River Guide Ada">
                    <figcaption>Ada - River Guide</figcaption>
                </figure>
                <figure>
                    <img src="Images/employee2.jpg" alt="Manager John">
                    <figcaption>John - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="Images/employee3.jpg" alt="Safety Officer Mike">
                    <figcaption>Mike - Safety Officer</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label><input type="radio" name="purpose" value="general" required> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label><input type="checkbox" name="newsletter"> Please subscribe me to the monthly
                    newsletter</label>

                <button type="submit">Send My Inquiry</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 | Kings And Priests Rafting Company | Eze Chinecherem</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="Images/facebook.webp" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="Images/twitter.jpg" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="Images/instag.webp" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
